<div class="p-5 border border-gray-200 rounded-2xl dark:border-gray-800 lg:p-6">
  <div class="flex flex-col gap-5 xl:flex-row xl:items-start xl:justify-between">
    <div class="flex flex-col items-center w-full gap-6 xl:flex-row">
      <!-- Avatar -->
      <div class="relative">
        <div class="flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 text-white text-2xl font-semibold">
          {{ getUserInitials() }}
        </div>
        <button 
          (click)="openModal()"
          class="absolute bottom-0 right-0 flex items-center justify-center w-6 h-6 bg-white rounded-full shadow-md dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
          <svg class="w-3.5 h-3.5 text-gray-600 dark:text-gray-400" fill="currentColor" viewBox="0 0 20 20">
            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
          </svg>
        </button>
      </div>

      <!-- User Info -->
      <div class="flex-1 text-center xl:text-left">
        <h4 class="text-lg font-semibold text-gray-800 dark:text-white/90">
          {{ getUserFullName() }}
        </h4>
        <p class="text-sm text-gray-500 dark:text-gray-400">
          {{ getUserRole() }}
        </p>
        <div class="flex flex-wrap items-center justify-center gap-3 mt-2 xl:justify-start">
          <span class="inline-flex items-center gap-1.5 text-sm text-gray-500 dark:text-gray-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            {{ getUserEmail() }}
          </span>
          <span class="inline-flex items-center gap-1.5 text-sm text-gray-500 dark:text-gray-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
            </svg>
            {{ getUserPhone() }}
          </span>
          <span class="inline-flex items-center gap-1.5 text-sm text-gray-500 dark:text-gray-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            {{ getUserLocation() }}
          </span>
        </div>
      </div>
    </div>

    <!-- Edit Button -->
    <button 
      (click)="openModal()"
      class="flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium text-white rounded-lg bg-brand-500 hover:bg-brand-600 dark:bg-brand-600 dark:hover:bg-brand-700 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
      </svg>
      Edit Profile
    </button>
  </div>
</div>

<!-- Edit Profile Modal -->
<app-modal [isOpen]="isOpen" (close)="closeModal()" className="max-w-[600px] p-6 lg:p-8">
  <div class="flex items-center gap-3 mb-6">
    <svg class="w-6 h-6 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
    </svg>
    <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Edit Profile</h3>
  </div>
  
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Full Name
      </label>
      <input 
        type="text" 
        [(ngModel)]="editUser.fullName"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent"
        placeholder="Enter full name">
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Email
      </label>
      <input 
        type="email" 
        [(ngModel)]="editUser.email"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent"
        placeholder="Enter email">
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Phone
      </label>
      <input 
        type="text" 
        [(ngModel)]="editUser.phone"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent"
        placeholder="Enter phone number">
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Designation
      </label>
      <input 
        type="text" 
        [(ngModel)]="editUser.designation"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent"
        placeholder="Enter designation">
    </div>
  </div>

  <div class="flex justify-end gap-3 mt-6 pt-6 border-t border-gray-200 dark:border-gray-800">
    <button 
      class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg dark:bg-gray-800 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
      (click)="closeModal()">
      Cancel
    </button>
    <button 
      class="px-4 py-2 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 dark:bg-brand-600 dark:hover:bg-brand-700 transition-colors"
      (click)="handleSave()">
      Save Changes
    </button>
  </div>
</app-modal>
