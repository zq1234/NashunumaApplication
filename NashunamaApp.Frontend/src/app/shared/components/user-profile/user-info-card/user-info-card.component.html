<div class="p-5 border border-gray-200 rounded-2xl dark:border-gray-800 lg:p-6">
  <div class="flex flex-col gap-6 lg:flex-row lg:items-start lg:justify-between">
    <div>
      <h4 class="text-lg font-semibold text-gray-800 dark:text-white/90">Personal Information</h4>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Your personal details and contact information</p>
    </div>
    <button 
      (click)="openModal()"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-brand-600 bg-brand-50 rounded-lg hover:bg-brand-100 dark:bg-brand-900/20 dark:text-brand-400 dark:hover:bg-brand-900/30 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
      </svg>
      Edit
    </button>
  </div>

  <div class="grid grid-cols-1 gap-4 mt-6 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-500 dark:text-gray-400">Full Name</label>
      <p class="mt-1 text-sm text-gray-800 dark:text-white/90">{{ getUserFullName() }}</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-500 dark:text-gray-400">Email Address</label>
      <p class="mt-1 text-sm text-gray-800 dark:text-white/90">{{ getUserEmail() }}</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-500 dark:text-gray-400">Phone Number</label>
      <p class="mt-1 text-sm text-gray-800 dark:text-white/90">{{ getUserPhone() }}</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-500 dark:text-gray-400">Designation</label>
      <p class="mt-1 text-sm text-gray-800 dark:text-white/90">{{ getUserDesignation() }}</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-500 dark:text-gray-400">User Type</label>
      <p class="mt-1 text-sm text-gray-800 dark:text-white/90">{{ getUserRole() }}</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-500 dark:text-gray-400">Status</label>
      <span class="inline-flex items-center gap-1.5 mt-1 px-2.5 py-0.5 rounded-full text-xs font-medium" [ngClass]="getUserStatusClass()">
        <span class="w-1.5 h-1.5 rounded-full" [class.bg-green-400]="user?.isActive" [class.bg-red-400]="!user?.isActive"></span>
        {{ getUserStatus() }}
      </span>
    </div>
  </div>
</div>

<!-- Edit Info Modal -->
<app-modal [isOpen]="isOpen" (close)="closeModal()" className="max-w-[600px] p-6 lg:p-8">
  <div class="flex items-center gap-3 mb-6">
    <svg class="w-6 h-6 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
    </svg>
    <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Edit Personal Information</h3>
  </div>
  
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Full Name
      </label>
      <input 
        type="text" 
        [(ngModel)]="editInfo.fullName"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent"
        placeholder="Enter full name">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Email
      </label>
      <input 
        type="email" 
        [(ngModel)]="editInfo.email"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent"
        placeholder="Enter email">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Phone
      </label>
      <input 
        type="text" 
        [(ngModel)]="editInfo.phone"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent"
        placeholder="Enter phone number">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Designation
      </label>
      <input 
        type="text" 
        [(ngModel)]="editInfo.designation"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent"
        placeholder="Enter designation">
    </div>
  </div>

  <div class="flex justify-end gap-3 mt-6 pt-6 border-t border-gray-200 dark:border-gray-800">
    <button 
      class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg dark:bg-gray-800 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
      (click)="closeModal()">
      Cancel
    </button>
    <button 
      class="px-4 py-2 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 dark:bg-brand-600 dark:hover:bg-brand-700 transition-colors"
      (click)="handleSave()">
      Save Changes
    </button>
  </div>
</app-modal>
