<div class="p-5 border border-gray-200 rounded-2xl dark:border-gray-800 lg:p-6">
  <div class="flex flex-col gap-6 lg:flex-row lg:items-start lg:justify-between">
    <div>
      <h4 class="text-lg font-semibold text-gray-800 dark:text-white/90">Location & Site</h4>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Your location and site information</p>
    </div>
    <button 
      (click)="openModal()"
      class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-brand-600 bg-brand-50 rounded-lg hover:bg-brand-100 dark:bg-brand-900/20 dark:text-brand-400 dark:hover:bg-brand-900/30 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
      </svg>
      Edit
    </button>
  </div>

  <div class="grid grid-cols-1 gap-4 mt-6 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-500 dark:text-gray-400">Province</label>
      <p class="mt-1 text-sm text-gray-800 dark:text-white/90">{{ getProvince() }}</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-500 dark:text-gray-400">District</label>
      <p class="mt-1 text-sm text-gray-800 dark:text-white/90">{{ getDistrict() }}</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-500 dark:text-gray-400">Tehsil</label>
      <p class="mt-1 text-sm text-gray-800 dark:text-white/90">{{ getTehsil() }}</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-500 dark:text-gray-400">Site Name</label>
      <p class="mt-1 text-sm text-gray-800 dark:text-white/90">{{ getSiteName() }}</p>
    </div>
    <div class="sm:col-span-2">
      <label class="block text-sm font-medium text-gray-500 dark:text-gray-400">Full Location</label>
      <p class="mt-1 text-sm text-gray-800 dark:text-white/90">{{ getFullLocation() }}</p>
    </div>
    <div class="sm:col-span-2">
      <label class="block text-sm font-medium text-gray-500 dark:text-gray-400">Site Address</label>
      <p class="mt-1 text-sm text-gray-800 dark:text-white/90">{{ getSiteAddress() }}</p>
    </div>
  </div>
</div>

<!-- Edit Address Modal -->
<app-modal [isOpen]="isOpen" (close)="closeModal()" className="max-w-[600px] p-6 lg:p-8">
  <div class="flex items-center gap-3 mb-6">
    <svg class="w-6 h-6 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
    </svg>
    <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Edit Location</h3>
  </div>
  
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Province
      </label>
      <input 
        type="text" 
        [(ngModel)]="editAddress.province"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent"
        placeholder="Enter province">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        District
      </label>
      <input 
        type="text" 
        [(ngModel)]="editAddress.district"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent"
        placeholder="Enter district">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Tehsil
      </label>
      <input 
        type="text" 
        [(ngModel)]="editAddress.tehsil"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent"
        placeholder="Enter tehsil">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Site Name
      </label>
      <input 
        type="text" 
        [(ngModel)]="editAddress.siteName"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent"
        placeholder="Enter site name">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Site Address
      </label>
      <input 
        type="text" 
        [(ngModel)]="editAddress.siteAddress"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:border-gray-600 dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent"
        placeholder="Enter site address">
    </div>
  </div>

  <div class="flex justify-end gap-3 mt-6 pt-6 border-t border-gray-200 dark:border-gray-800">
    <button 
      class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg dark:bg-gray-800 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
      (click)="closeModal()">
      Cancel
    </button>
    <button 
      class="px-4 py-2 text-sm font-medium text-white bg-brand-500 rounded-lg hover:bg-brand-600 dark:bg-brand-600 dark:hover:bg-brand-700 transition-colors"
      (click)="handleSave()">
      Save Changes
    </button>
  </div>
</app-modal>
