<!-- src/app/shared/components/auth/signin-form/signin-form.component.html -->
<div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
  <div>
    <div class="mb-5 flex items-center justify-center sm:mb-8">
      <img class="h-24 w-auto dark:hidden" src="/images/logo/white-logo.png" alt="Nashunama logo" />
      <img class="hidden h-24 w-auto dark:block" src="/images/logo/dark-logo.png" alt="Nashunama logo" />
    </div>
    <div class="mb-5 sm:mb-8">
      <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">
        Sign In
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Enter your email and password to sign in!
      </p>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
      {{ errorMessage }}
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSignIn()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
          Email <span class="text-red-500">*</span>
        </label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="info@gmail.com"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-800 dark:border-gray-700 dark:text-white"
          required
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
          Password <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-800 dark:border-gray-700 dark:text-white"
            required
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500"
          >
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <input type="checkbox" id="remember" class="rounded border-gray-300">
          <label for="remember" class="text-sm text-gray-700 dark:text-gray-300">Keep me logged in</label>
        </div>
        <a routerLink="/reset-password" class="text-sm text-blue-600 hover:text-blue-700">
          Forgot password?
        </a>
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full px-4 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="mt-5 text-center">
      <p class="text-sm text-gray-700 dark:text-gray-400">
        Don't have an account?
        <a routerLink="/signup" class="text-blue-600 hover:text-blue-700">
          Sign Up
        </a>
      </p>
    </div>
  </div>
</div>
