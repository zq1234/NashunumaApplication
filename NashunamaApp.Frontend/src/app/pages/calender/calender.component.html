<div>
  <app-page-breadcrumb pageTitle="Calendar" />

  <app-component-card title="Calendar" desc="Manage your schedule using the standard form controls and panel layout.">
    <div class="custom-calendar">
      <full-calendar #calendar [options]="calendarOptions"></full-calendar>
    </div>
  </app-component-card>

  <app-modal
    [isOpen]="isOpen"
    (close)="closeModal()"
    className="max-w-[700px] p-6 lg:p-10"
  >
    <div class="flex flex-col px-2 overflow-y-auto custom-scrollbar">
      <div>
        <h5 class="mb-2 font-semibold text-gray-800 modal-title text-theme-xl dark:text-white/90 lg:text-2xl">
          {{ selectedEvent ? 'Edit Event' : 'Add Event' }}
        </h5>
        <p class="text-sm text-gray-500 dark:text-gray-400">
          Plan your next big moment: schedule or edit an event to stay on track.
        </p>
      </div>

      <div class="mt-8 space-y-6">
        <div>
          <app-label for="event-title">Event Title</app-label>
          <app-input-field id="event-title" type="text" [value]="eventTitle" (valueChange)="eventTitle = $event.toString()"></app-input-field>
        </div>

        <div>
          <app-label>Event Color</app-label>
          <div class="flex flex-wrap items-center gap-4 sm:gap-5">
            @for (entry of (calendarsEvents | keyvalue); track $index) {
              <div class="n-chk">
                <div class="form-check form-check-inline" [class]="'form-check-' + entry.value">
                  <label class="flex items-center text-sm text-gray-700 form-check-label dark:text-gray-400" [for]="'modal' + entry.key">
                    <span class="relative">
                      <input class="sr-only form-check-input" type="radio" name="event-level" [value]="entry.key" [id]="'modal' + entry.key" [(ngModel)]="eventLevel" />
                      <span class="rounded-full flex items-center justify-center w-5 h-5 mr-2 border border-gray-300 box dark:border-gray-700">
                        <span class="h-2 w-2 rounded-full bg-white" [class.block]="eventLevel === entry.key" [class.hidden]="eventLevel !== entry.key"></span>
                      </span>
                    </span>
                    {{ entry.key }}
                  </label>
                </div>
              </div>
            }
          </div>
        </div>

        <div>
          <app-label for="event-start-date">Enter Start Date</app-label>
          <app-input-field id="event-start-date" type="date" [value]="eventStartDate" (valueChange)="eventStartDate = $event.toString()"></app-input-field>
        </div>

        <div>
          <app-label for="event-end-date">Enter End Date</app-label>
          <app-input-field id="event-end-date" type="date" [value]="eventEndDate" (valueChange)="eventEndDate = $event.toString()"></app-input-field>
        </div>
      </div>

      <div class="mt-6 flex items-center gap-3 modal-footer sm:justify-end">
        <app-button size="sm" variant="outline" (btnClick)="closeModal()">Close</app-button>
        <app-button size="sm" (btnClick)="handleAddOrUpdateEvent()">
          {{ selectedEvent ? 'Update Changes' : 'Add Event' }}
        </app-button>
      </div>
    </div>
  </app-modal>
</div>
